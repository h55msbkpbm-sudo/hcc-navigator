name: strip-portrait
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/strip_portrait.py
      - .github/workflows/strip-portrait.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip portrait
        run: python3 scripts/strip_portrait.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hcc-simulator.html
          if git diff --cached --quiet; then
            echo No HTML changes
            exit 0
          fi
          git commit -m "fix: remove Results patient portrait"
          git push

name: fix-funnel
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_funnel.py'
      - '.github/workflows/fix-funnel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_funnel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hcc-simulator.html
          if git diff --cached --quiet; then echo "No HTML changes"; exit 0; fi
          git commit -m "8 gating questions from MVI; cite-only HKCaR funnel"
          git push

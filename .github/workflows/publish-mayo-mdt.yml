name: publish-mayo-mdt
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/payload/**'
      - 'scripts/publish_mayo_mdt.py'
      - '.github/workflows/publish-mayo-mdt.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Mayo MDT HTML
        run: python3 scripts/publish_mayo_mdt.py
      - name: Commit if changed
        run: |
          git config user.name "hcc-simulator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hcc-simulator.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Mayo MDT polish: Q1 MVI 1 of 8, single Recommendation, Evidence fold"
          git push

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:Georgia,serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('ad0.b64'), fetch('ad1.b64'), fetch('ad2.b64'), fetch('ad3.b64'), fetch('ad4.b64'), fetch('ad5.b64'), fetch('ad6.b64'), fetch('ad7.b64'), fetch('ad8.b64'), fetch('ad9.b64'), fetch('ad10.b64'), fetch('ad11.b64'), fetch('ad12.b64'), fetch('ad13.b64'), fetch('ad14.b64'), fetch('ad15.b64'), fetch('ad16.b64'), fetch('ad17.b64'), fetch('ad18.b64'), fetch('ad19.b64'), fetch('ad20.b64'), fetch('ad21.b64'), fetch('ad22.b64'), fetch('ad23.b64'), fetch('ad24.b64'), fetch('ad25.b64'), fetch('ad26.b64'), fetch('ad27.b64'), fetch('ad28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

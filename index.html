<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('z0.b64'), fetch('z1.b64'), fetch('z2.b64'), fetch('z3.b64'), fetch('z4.b64'), fetch('z5.b64'), fetch('z6.b64'), fetch('z7.b64'), fetch('z8.b64'), fetch('z9.b64'), fetch('z10.b64'), fetch('z11.b64'), fetch('z12.b64'), fetch('z13.b64'), fetch('z14.b64'), fetch('z15.b64'), fetch('z16.b64'), fetch('z17.b64'), fetch('z18.b64'), fetch('z19.b64'), fetch('z20.b64'), fetch('z21.b64'), fetch('z22.b64'), fetch('z23.b64'), fetch('z24.b64'), fetch('z25.b64'), fetch('z26.b64'), fetch('z27.b64'), fetch('z28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('ab0.b64'), fetch('ab1.b64'), fetch('ab2.b64'), fetch('ab3.b64'), fetch('ab4.b64'), fetch('ab5.b64'), fetch('ab6.b64'), fetch('ab7.b64'), fetch('ab8.b64'), fetch('ab9.b64'), fetch('ab10.b64'), fetch('ab11.b64'), fetch('ab12.b64'), fetch('ab13.b64'), fetch('ab14.b64'), fetch('ab15.b64'), fetch('ab16.b64'), fetch('ab17.b64'), fetch('ab18.b64'), fetch('ab19.b64'), fetch('ab20.b64'), fetch('ab21.b64'), fetch('ab22.b64'), fetch('ab23.b64'), fetch('ab24.b64'), fetch('ab25.b64'), fetch('ab26.b64'), fetch('ab27.b64'), fetch('ab28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

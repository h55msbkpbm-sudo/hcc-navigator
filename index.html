<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('u0.b64'), fetch('u1.b64'), fetch('u2.b64'), fetch('u3.b64'), fetch('u4.b64'), fetch('u5.b64'), fetch('u6.b64'), fetch('u7.b64'), fetch('u8.b64'), fetch('u9.b64'), fetch('u10.b64'), fetch('u11.b64'), fetch('u12.b64'), fetch('u13.b64'), fetch('u14.b64'), fetch('u15.b64'), fetch('u16.b64'), fetch('u17.b64'), fetch('u18.b64'), fetch('u19.b64'), fetch('u20.b64'), fetch('u21.b64'), fetch('u22.b64'), fetch('u23.b64'), fetch('u24.b64'), fetch('u25.b64'), fetch('u26.b64'), fetch('u27.b64'), fetch('u28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HCC Simulator</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#0c1520;color:#e2e8f0}
.boot{display:flex;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:24px}
.boot p{opacity:.75;font-size:14px;margin:0}
</style>
</head>
<body>
<div class="boot" id="boot"><p>Loading HCC Simulator…</p></div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('c0.b64'), fetch('c1.b64'), fetch('c2.b64'), fetch('c3.b64'), fetch('c4.b64'), fetch('c5.b64'), fetch('c6.b64'), fetch('c7.b64'), fetch('c8.b64'), fetch('c9.b64'), fetch('c10.b64'), fetch('c11.b64'), fetch('c12.b64'), fetch('c13.b64'), fetch('c14.b64'), fetch('c15.b64'), fetch('c16.b64'), fetch('c17.b64'), fetch('c18.b64'), fetch('c19.b64'), fetch('c20.b64'), fetch('c21.b64'), fetch('c22.b64'), fetch('c23.b64'), fetch('c24.b64'), fetch('c25.b64')]);
    for (var i = 0; i < parts.length; i++) if (!parts[i].ok) throw new Error('chunk ' + i + ' ' + parts[i].status);
    var texts = await Promise.all(parts.map(function (r) { return r.text(); }));
    var b64 = texts.map(function (t) { return t.trim(); }).join('');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML = '<p>Could not load.</p><p style="font-size:12px;opacity:.5">' + e + '</p>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('w0.b64'), fetch('w1.b64'), fetch('w2.b64'), fetch('w3.b64'), fetch('w4.b64'), fetch('w5.b64'), fetch('w6.b64'), fetch('w7.b64'), fetch('w8.b64'), fetch('w9.b64'), fetch('w10.b64'), fetch('w11.b64'), fetch('w12.b64'), fetch('w13.b64'), fetch('w14.b64'), fetch('w15.b64'), fetch('w16.b64'), fetch('w17.b64'), fetch('w18.b64'), fetch('w19.b64'), fetch('w20.b64'), fetch('w21.b64'), fetch('w22.b64'), fetch('w23.b64'), fetch('w24.b64'), fetch('w25.b64'), fetch('w26.b64'), fetch('w27.b64'), fetch('w28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

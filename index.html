<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('y0.b64'), fetch('y1.b64'), fetch('y2.b64'), fetch('y3.b64'), fetch('y4.b64'), fetch('y5.b64'), fetch('y6.b64'), fetch('y7.b64'), fetch('y8.b64'), fetch('y9.b64'), fetch('y10.b64'), fetch('y11.b64'), fetch('y12.b64'), fetch('y13.b64'), fetch('y14.b64'), fetch('y15.b64'), fetch('y16.b64'), fetch('y17.b64'), fetch('y18.b64'), fetch('y19.b64'), fetch('y20.b64'), fetch('y21.b64'), fetch('y22.b64'), fetch('y23.b64'), fetch('y24.b64'), fetch('y25.b64'), fetch('y26.b64'), fetch('y27.b64'), fetch('y28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

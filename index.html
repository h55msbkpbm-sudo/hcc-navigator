<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('r0.b64'), fetch('r1.b64'), fetch('r2.b64'), fetch('r3.b64'), fetch('r4.b64'), fetch('r5.b64'), fetch('r6.b64'), fetch('r7.b64'), fetch('r8.b64'), fetch('r9.b64'), fetch('r10.b64'), fetch('r11.b64'), fetch('r12.b64'), fetch('r13.b64'), fetch('r14.b64'), fetch('r15.b64'), fetch('r16.b64'), fetch('r17.b64'), fetch('r18.b64'), fetch('r19.b64'), fetch('r20.b64'), fetch('r21.b64'), fetch('r22.b64'), fetch('r23.b64'), fetch('r24.b64'), fetch('r25.b64'), fetch('r26.b64'), fetch('r27.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('s0.b64'), fetch('s1.b64'), fetch('s2.b64'), fetch('s3.b64'), fetch('s4.b64'), fetch('s5.b64'), fetch('s6.b64'), fetch('s7.b64'), fetch('s8.b64'), fetch('s9.b64'), fetch('s10.b64'), fetch('s11.b64'), fetch('s12.b64'), fetch('s13.b64'), fetch('s14.b64'), fetch('s15.b64'), fetch('s16.b64'), fetch('s17.b64'), fetch('s18.b64'), fetch('s19.b64'), fetch('s20.b64'), fetch('s21.b64'), fetch('s22.b64'), fetch('s23.b64'), fetch('s24.b64'), fetch('s25.b64'), fetch('s26.b64'), fetch('s27.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

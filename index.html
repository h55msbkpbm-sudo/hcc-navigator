<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('aa0.b64'), fetch('aa1.b64'), fetch('aa2.b64'), fetch('aa3.b64'), fetch('aa4.b64'), fetch('aa5.b64'), fetch('aa6.b64'), fetch('aa7.b64'), fetch('aa8.b64'), fetch('aa9.b64'), fetch('aa10.b64'), fetch('aa11.b64'), fetch('aa12.b64'), fetch('aa13.b64'), fetch('aa14.b64'), fetch('aa15.b64'), fetch('aa16.b64'), fetch('aa17.b64'), fetch('aa18.b64'), fetch('aa19.b64'), fetch('aa20.b64'), fetch('aa21.b64'), fetch('aa22.b64'), fetch('aa23.b64'), fetch('aa24.b64'), fetch('aa25.b64'), fetch('aa26.b64'), fetch('aa27.b64'), fetch('aa28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('t0.b64'), fetch('t1.b64'), fetch('t2.b64'), fetch('t3.b64'), fetch('t4.b64'), fetch('t5.b64'), fetch('t6.b64'), fetch('t7.b64'), fetch('t8.b64'), fetch('t9.b64'), fetch('t10.b64'), fetch('t11.b64'), fetch('t12.b64'), fetch('t13.b64'), fetch('t14.b64'), fetch('t15.b64'), fetch('t16.b64'), fetch('t17.b64'), fetch('t18.b64'), fetch('t19.b64'), fetch('t20.b64'), fetch('t21.b64'), fetch('t22.b64'), fetch('t23.b64'), fetch('t24.b64'), fetch('t25.b64'), fetch('t26.b64'), fetch('t27.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>

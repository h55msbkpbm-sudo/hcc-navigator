<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#003da5"><title>HCC Simulator</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;color:#003da5;font-family:system-ui,sans-serif}.boot{display:flex;align-items:center;justify-content:center;min-height:100%}</style>
</head><body>
<div class="boot" id="boot">Loading HCC Simulator…</div>
<script>
(async function () {
  try {
    var parts = await Promise.all([fetch('v0.b64'), fetch('v1.b64'), fetch('v2.b64'), fetch('v3.b64'), fetch('v4.b64'), fetch('v5.b64'), fetch('v6.b64'), fetch('v7.b64'), fetch('v8.b64'), fetch('v9.b64'), fetch('v10.b64'), fetch('v11.b64'), fetch('v12.b64'), fetch('v13.b64'), fetch('v14.b64'), fetch('v15.b64'), fetch('v16.b64'), fetch('v17.b64'), fetch('v18.b64'), fetch('v19.b64'), fetch('v20.b64'), fetch('v21.b64'), fetch('v22.b64'), fetch('v23.b64'), fetch('v24.b64'), fetch('v25.b64'), fetch('v26.b64'), fetch('v27.b64'), fetch('v28.b64')]);
    var texts = await Promise.all(parts.map(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }));
    var bin = atob(texts.map(function (t) { return t.trim(); }).join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { document.getElementById('boot').textContent = 'Could not load.'; }
})();
</script></body></html>
